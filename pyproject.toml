
[project]
name = "flowadj"
version = "0.1.0"
description = "LLM agents for network incident adjudication"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas",
    "pyarrow",
    "duckdb",
    "scikit-learn",
    "pydantic",
    "pyyaml",
    "python-dotenv",
    "ollama",
    "matplotlib",
    "scipy",
    "tabulate",
    "streamlit",
    "crewai",
    "langchain",
    "langgraph",
]

[dependency-groups]
dev = [
    "pytest",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowadj"]

[tool.pytest.ini_options]
testpaths = ["tests"]
